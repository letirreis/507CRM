<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Gravidade 507 logo</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e45fa6"/>
      <stop offset="1" stop-color="#78124e"/>
    </linearGradient>
  </defs>
  <!-- Maskable: keep important content within the safe zone -->
  <rect width="512" height="512" fill="url(#g)"/>
  <circle cx="256" cy="256" r="180" fill="rgba(255,255,255,0.1)"/>
  <!-- "507" text centered within safe zone -->
  <text x="210" y="315" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="175" text-anchor="middle" fill="rgba(255,255,255,0.25)">50</text>
  <text x="360" y="330" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="195" text-anchor="middle" fill="#ffffff">7</text>
</svg>

